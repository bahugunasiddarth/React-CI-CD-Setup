name: "Sample React CI Pipeline / Workflows"

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "21"

      - name: "Check Node version"
        run: node --version

      - name: "Clone Repo"  
        uses: actions/checkout@v2

      - name: "List directories"  
        run:   ls